name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Sprite assets
        run: |
          python tools/gen_sprites.py --check
          git diff --exit-code -- themes/quotadeck-crew
      - name: Theme validation
        run: python -m quotadeck theme validate themes/quotadeck-crew
      - name: Dependency-light UX acceptance
        run: python tools/verify_refresh.py
      - name: Test
        run: pytest -q
      - name: Preview artifacts
        run: |
          python tools/export_crew.py
          python tools/export_preview.py
          git diff --exit-code -- docs
      - name: PyInstaller
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          pyinstaller --noconfirm QuotaDeck.spec
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: QuotaDeck-windows
          path: dist/QuotaDeck.exe
