name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Sprites
        run: python tools/gen_sprites.py
      - name: Test
        run: pytest -q
      - name: Preview GIF
        run: python -m quotadeck render --fixture tests/fixtures/usage.json --out docs/hero-preview.gif
      - name: PyInstaller
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          pyinstaller --noconfirm QuotaDeck.spec
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: QuotaDeck-windows
          path: dist/QuotaDeck.exe
