[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotadeck"
version = "0.2.3"
description = "AI coding usage display for the AULA F108 Pro LCD"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "QuotaDeck contributors" }]
dependencies = [
    "Pillow>=10.4.0",
    "httpx>=0.27.0",
    "hidapi>=0.14.0",
    "PySide6>=6.7.0",
]
[project.optional-dependencies]
dev = [
    # Sprite resampling/quantization must match committed runtime pixels.
    "Pillow==12.3.0",
    "pytest>=8.0.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
quotadeck = "quotadeck.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quotadeck = [
    "bundled/themes/quotadeck-crew/theme.json",
    "bundled/themes/quotadeck-crew/provider/codex/*.png",
    "bundled/themes/quotadeck-crew/provider/claude/*.png",
    "bundled/themes/quotadeck-crew/provider/cursor/*.png",
    "bundled/themes/quotadeck-crew/provider/grok/*.png",
    "bundled/icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
