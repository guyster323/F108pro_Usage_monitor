[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotadeck"
version = "0.1.0"
description = "AI coding usage display for the AULA F108 Pro LCD"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "QuotaDeck contributors" }]
dependencies = [
    "Pillow>=10.4.0",
    "httpx>=0.27.0",
    "hidapi>=0.14.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
quotadeck = "quotadeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
